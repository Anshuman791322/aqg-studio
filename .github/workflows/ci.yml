name: AQG Studio CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    name: Backend Lint, Typecheck & Tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Check
        run: python -m ruff check .

      - name: Run mypy Strict Type Check
        run: python -m mypy app

      - name: Run Pytest Test Suite
        run: python -m pytest -v tests/
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          SUPABASE_JWT_SECRET: "test-jwt-secret-key-at-least-32-characters-long"
          OPENROUTER_API_KEY: "sk-mock-key"
          NVIDIA_API_KEY: "nvapi-mock-key"

  frontend-ci:
    name: Frontend Lint, Typecheck & Build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Frontend Tests
        run: npm test
        env:
          CI: "true"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
