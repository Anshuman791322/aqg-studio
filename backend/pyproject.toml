[project]
name = "aqg-studio-backend"
version = "0.1.0"
description = "FastAPI backend and LangGraph multi-agent orchestration service for AQG Studio"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "httpx>=0.27.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
    "pymupdf>=1.24.10",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "fastembed>=0.3.6",
    "pgvector>=0.3.4",
    "defusedxml>=0.7.1",
    "reportlab>=4.2.2",
    "jinja2>=3.1.4",
    "tiktoken>=0.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.5",
    "mypy>=1.11.2",
    "types-python-jose>=3.3.4",
    "types-passlib>=1.7.7"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008", "N818", "UP046", "UP047", "E501"]




[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
